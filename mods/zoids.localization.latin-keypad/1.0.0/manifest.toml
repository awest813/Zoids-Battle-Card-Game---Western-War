# Rotate only page table pointers. The stock glyphs and key handling stay intact.
format_version = 5
id = "zoids.localization.latin-keypad"
version = "1.0.0"
name = "Latin-first name entry"
description = "Open the original Latin name-entry page first in English."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLPS-03255"

[[feature]]
id = "latin-first"
name = "Latin-first name entry"
default_enabled = false

[[patch]]
feature = "latin-first"
target = "main_exe"
address = 0x8001f36c
expected = "54 f3 01 80"
replace = "98 6d 0f 80"

